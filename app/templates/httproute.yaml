{{- if .Values.route.enabled }}
# Gateway API HTTPRoute — the app declares its OWN external exposure. It attaches to the shared,
# platform-owned Gateway via parentRefs and routes host/path -> this unit's own Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway }}
      {{- with .Values.route.gatewayNamespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.route.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ .Values.route.host | quote }}
  rules:
    - matches:
        - path:
            type: {{ .Values.route.pathType | default "PathPrefix" }}
            value: {{ .Values.route.path | default "/" | quote }}
      backendRefs:
        - name: {{ include "app.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
